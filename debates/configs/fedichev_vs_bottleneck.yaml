run_id: "fedichev_vs_bottleneck"
theory:
  id: "fedichev"
  page: "docs/theories/resilience_criticality.md"
opponent:
  id: "longevity_bottleneck"
  page: "docs/theories/longevity_bottleneck.md"

rounds: 4

roles:
  defender:
    provider: "gemini"
  critic:
    provider: "codex"
  judge:
    provider: "claude"

context:
  extra_files:
    - "docs/compare/rubric.md"
    - "docs/compare/index.md"
    - "data/claims.yaml"
    - "data/evidence.csv"
    - "references/references.bib"
    - "references/links.yaml"
  max_chars_per_file: 60000
  include_evidence_rows_for_theory_ids: ["fedichev"]

output:
  runs_dir: "debates/runs"
  publish_mkdocs_dir: "docs/debates"
  write_raw_jsonl: true
