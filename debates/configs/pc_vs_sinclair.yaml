  id: "sinclair"
  page: "docs/theories/epigenetic_information.md"

rounds: 4

roles:
  defender:
    provider: "gemini"
  critic:
    provider: "codex"
  judge:
    provider: "claude"

context:
  extra_files:
    - "docs/compare/rubric.md"
